[project]
name = "duofy-backend"
# Bleibt stehen. Die Version von Duofy steht in ../version.txt und wandert
# von dort in Tag, Changelog und Docker-Tag. Würde release-please sie hier
# mitheben, passte uv.lock nicht mehr dazu und jeder Bau mit --locked
# scheiterte. Niemand installiert Duofy als Paket, die Zahl liest keiner.
version = "0.0.0"
description = "Duofy — plan money, don't track it"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "fastapi-users[sqlalchemy]>=14.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Migrationen werden generiert, nicht von Hand geschrieben.
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# Depends() im Default-Argument ist das FastAPI-Idiom, kein Fehler.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Tests and fixtures share one event loop for the whole run. Without this, a
# session-scoped async fixture — the engine — belongs to a different loop than the
# test using it, and asyncpg answers every query with "another operation is in
# progress".
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
