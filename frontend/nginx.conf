server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Der Browser holt die Seite hier und schickt seine Anfragen an dieselbe
    # Adresse. Von /api geht es weiter an den Backend-Container, der im
    # Docker-Netz „backend" heißt.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Die Dateinamen unter /assets tragen einen Hash. Ändert sich der Inhalt,
    # ändert sich der Name — sie dürfen deshalb ewig im Zwischenspeicher liegen.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html dagegen **nie** zwischenspeichern. Sonst zeigt der Browser nach
    # einem Update weiter die alte Datei, die auf Asset-Namen verweist, die es
    # nicht mehr gibt — die Anwendung bliebe weiß.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Einseitige Anwendung: /plan/2026/8 ist keine Datei auf der Platte. Alles,
    # was nicht existiert, bekommt index.html, und der Router im Browser
    # entscheidet weiter.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
