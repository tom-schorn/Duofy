# Die eigene Datenbank im Compose, für einen Server ohne eigenen PostgreSQL-Server (Spec 79, Nachtrag 2026-10-26).
# Sie ergänzt docker-compose.yml und läuft nur zusammen mit ihr:
#
#   docker compose -f docker-compose.yml -f own-db.yml --env-file .env up -d --build
#
# oder einmal in der .env: COMPOSE_FILE=docker-compose.yml:own-db.yml, dann reicht docker compose up -d --build.
#
# Die Datenbank hängt nur im internen Netz plagevo-backend (172.30.11.0/24) ohne Weg nach draußen; API und Sicherung
# treten ihm zusätzlich bei, der Tunnel nie. In der .env muss die Verbindung dann auf sie zeigen:
#   ConnectionStrings__Duofy=Host=172.30.11.10;Port=5432;Database=duofy;Username=duofy;Password=<POSTGRES_PASSWORD>

services:
  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-duofy}
      POSTGRES_USER: ${POSTGRES_USER:-duofy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in .env (Passwort der eigenen Datenbank)}
    # Klein eingestellt für einen Server mit knapp 3 GB; Duofy braucht wenige Verbindungen.
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=384MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=30
    mem_limit: 512m
    volumes:
      # PostgreSQL 18 legt seine Daten unter /var/lib/postgresql/18/docker ab.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=$${POSTGRES_USER} --dbname=$${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      plagevo-backend:
        ipv4_address: 172.30.11.10

  api:
    depends_on:
      db:
        condition: service_healthy
    networks:
      plagevo-backend:
        ipv4_address: 172.30.11.11

  backup:
    depends_on:
      db:
        condition: service_healthy
    networks:
      plagevo-backend:
        ipv4_address: 172.30.11.13

volumes:
  db-data:

networks:
  # Datenbank, API und Sicherung; ohne Weg nach draußen. Feste Adressen: Gateway .1, db .10, api .11, backup .13.
  plagevo-backend:
    name: ${PLAGEVO_BACKEND_NETWORK:-plagevo-backend}
    internal: true
    ipam:
      config:
        - subnet: 172.30.11.0/24
          gateway: 172.30.11.1
