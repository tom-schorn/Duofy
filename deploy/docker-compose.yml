# Plagevo auf dem Server hinter einem Cloudflare Tunnel (Spec 79). Anleitung: docs/betrieb.md.
#
#   cd deploy
#   cp .env.example .env      # ausfüllen, nie einchecken
#   docker compose --env-file .env up -d --build
#
# Die Datenbank gehört nicht dazu: Die API und die Sicherung erreichen den PostgreSQL-Server, den
# ConnectionStrings__Duofy in der .env nennt (bei Plagevo zu Hause, über Tailscale). Wer keinen eigenen Server hat,
# startet die Datenbank mit der zweiten Datei own-db.yml dazu (docs/betrieb.md, "Eigene Datenbank im Compose").
#
# Kein Dienst veröffentlicht einen Port: Von außen kommt man nur über den Tunnel herein. Alle Dienste hängen mit fester
# Adresse im eigenen Netz plagevo (172.30.10.0/24), das diese Datei anlegt. Der Tunnel läuft auf dem Server in einem
# eigenen Compose-Projekt (/root/infrastructure); sein Container cloudflared tritt dem Netz plagevo als externem Netz mit
# der Adresse 172.30.10.2 bei. Deshalb startet Plagevo zuerst, danach das Projekt des Tunnels. Der Tunnel leitet
# portal.plagevo.de an http://172.30.10.12:8080 (web) und api.plagevo.de an http://172.30.10.11:8080 (api).
# Auf einem frischen Server ohne Tunnel startet der Dienst tunnel mit: docker compose --profile own-tunnel ...
#
# Der Server hat knapp 3 GB Arbeitsspeicher; jeder Dienst hat deshalb eine feste Grenze (zusammen etwa 1,1 GB).

name: plagevo

x-build-args: &build-args
  VERSION: ${PLAGEVO_VERSION:-dev}
  BUILD_DATE: ${PLAGEVO_BUILD_DATE:-unknown}

# Die .NET-Dienste mit dem sparsamen Garbage Collector: Der Server-GC hält pro Kern eigenen Speicher vor.
x-dotnet-env: &dotnet-env
  DOTNET_gcServer: "0"

services:
  api:
    build:
      context: ..
      dockerfile: Backend/Duofy.Backend/Dockerfile
      args: *build-args
    image: plagevo-api:${PLAGEVO_VERSION:-dev}
    restart: unless-stopped
    mem_limit: 384m
    # Jede Einstellung gilt in der Schreibweise von .NET (Duofy__Mail__Host) oder unter dem alten Namen
    # (DUOFY_MAIL_HOST); stehen beide in der .env, gewinnt die Schreibweise von .NET, sonst gilt der Standard dahinter.
    environment:
      <<: *dotnet-env
      # Die Verbindung zur Datenbank, zum Beispiel Host=100.x.y.z;Port=5432;Database=plagevo;Username=plagevo;Password=...
      ConnectionStrings__Duofy: ${ConnectionStrings__Duofy:?ConnectionStrings__Duofy fehlt in .env (Verbindung zur Datenbank, siehe docs/betrieb.md)}
      Duofy__Hosted: ${Duofy__Hosted:-${DUOFY_HOSTED:-true}}
      Duofy__PublicUrl: ${Duofy__PublicUrl:-${DUOFY_PUBLIC_URL:-https://portal.plagevo.de}}
      Duofy__RegistrationMode: ${Duofy__RegistrationMode:-${DUOFY_REGISTRATION_MODE:-invite}}
      Duofy__SetupCode: ${Duofy__SetupCode:-${DUOFY_SETUP_CODE:-}}
      Duofy__ImprintFile: ${Duofy__ImprintFile:-${DUOFY_IMPRINT_FILE:-}}
      Duofy__PrivacyFile: ${Duofy__PrivacyFile:-${DUOFY_PRIVACY_FILE:-}}
      Duofy__TermsFile: ${Duofy__TermsFile:-${DUOFY_TERMS_FILE:-}}
      Duofy__Mail__Host: ${Duofy__Mail__Host:-${DUOFY_MAIL_HOST:-}}
      Duofy__Mail__Port: ${Duofy__Mail__Port:-${DUOFY_MAIL_PORT:-587}}
      Duofy__Mail__User: ${Duofy__Mail__User:-${DUOFY_MAIL_USER:-}}
      Duofy__Mail__Password: ${Duofy__Mail__Password:-${DUOFY_MAIL_PASSWORD:-}}
      Duofy__Mail__From: ${Duofy__Mail__From:-${DUOFY_MAIL_FROM:noreply@example.org}}
      Duofy__Mail__FromName: ${Duofy__Mail__FromName:-${Duofy__Mail__From__Name:-${DUOFY_MAIL_FROM_NAME:-Plagevo}}}
      Duofy__Mail__UseTls: ${Duofy__Mail__UseTls:-${DUOFY_MAIL_USE_TLS:-true}}
      # Nur der Tunnel an seiner festen Adresse darf die Adresse der Person nennen (CF-Connecting-IP).
      Duofy__TrustedProxies: ${Duofy__TrustedProxies:-${TRUSTED_PROXIES:-172.30.10.2/32}}
      # Die Web-Variante ruft die API für alle Web-Nutzer; sie ist von der Bremse ausgenommen, vor ihr bremst Cloudflare.
      RateLimiting__AuthPermitLimit: ${RateLimiting__AuthPermitLimit:-${RATE_LIMIT_AUTH_PERMIT_LIMIT:-10}}
      RateLimiting__ExemptAddresses: 172.30.10.12
      # Erinnerungen (Spec 84): aus, solange nichts gesetzt ist. Die Werte stehen nur in der .env, nie im Repository;
      # die Dienstkonto-Datei von Firebase liegt in deploy/push und ist unter /push nur lesbar eingehängt.
      Duofy__Reminders__Enabled: ${Duofy__Reminders__Enabled:-false}
      Duofy__Reminders__Fcm__ServiceAccountFile: ${Duofy__Reminders__Fcm__ServiceAccountFile:-}
      Duofy__Reminders__Wns__ClientId: ${Duofy__Reminders__Wns__ClientId:-}
      Duofy__Reminders__Wns__ClientSecret: ${Duofy__Reminders__Wns__ClientSecret:-}
      Duofy__KeysDirectory: /keys
    volumes:
      - keys:/keys
      # Rechtstexte (Impressum, Datenschutz, Nutzungsbedingungen), nur lesbar.
      - ./legal:/legal:ro
      # Zugangsdaten für Push (Firebase-Dienstkonto), nur lesbar; der Ordner darf leer sein, muss aber bestehen.
      - ./push:/push:ro
    networks:
      plagevo:
        ipv4_address: 172.30.10.11

  web:
    build:
      context: ..
      dockerfile: Web/Duofy.Web/Dockerfile
      args: *build-args
    image: plagevo-web:${PLAGEVO_VERSION:-dev}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 512m
    environment:
      <<: *dotnet-env
      # An der festen Adresse der API; die API erkennt die Web-Variante an deren fester Adresse 172.30.10.12.
      Duofy__ApiBaseAddress: http://172.30.10.11:8080/
      # Name und Logo: gehostet heißt Plagevo (derselbe Wert wie bei der API), Duofy__AppName nennt die Marke ausdrücklich.
      Duofy__Hosted: ${Duofy__Hosted:-${DUOFY_HOSTED:-true}}
      Duofy__AppName: ${Duofy__AppName:-${DUOFY_APP_NAME:-}}
      Duofy__TrustedProxies: ${Duofy__TrustedProxies:-${TRUSTED_PROXIES:-172.30.10.2/32}}
      Duofy__Analytics__Token: ${Duofy__Analytics__Token:-${CLOUDFLARE_ANALYTICS_TOKEN:-}}
      Crisp__WebsiteId: ${Crisp__WebsiteId:-${CRISP_WEBSITE_ID:-}}
      # Seiten, die die Web-Variante einbetten dürfen, durch Leerzeichen getrennt. Leer: niemand (so bleibt Plagevo).
      Duofy__FrameAncestors: ${Duofy__FrameAncestors:-${DUOFY_FRAME_ANCESTORS:-}}
      Duofy__KeysDirectory: /keys
    volumes:
      # Eigene Schlüssel für Formulare und den Zustand der Seiten; die der API schützen Tokens und bleiben getrennt.
      - web-keys:/keys
    networks:
      plagevo:
        ipv4_address: 172.30.10.12

  # Nur für einen frischen Server ohne eigenen Tunnel-Container: docker compose --profile own-tunnel ...
  tunnel:
    image: cloudflare/cloudflared:2026.10.0
    profiles: ["own-tunnel"]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    mem_limit: 128m
    # Leer als Standard: Compose prüft Pflichtvariablen in jedem Dienst, auch ohne sein Profil, und dann bräuchte
    # jeder Start ein Token, das nur dieser Dienst kennt. Fehlt es mit dem Profil, endet cloudflared mit einem Fehler im
    # Log (docs/betrieb.md, Schritt 13).
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    networks:
      plagevo:
        ipv4_address: 172.30.10.2

  backup:
    image: postgres:18.6-alpine
    restart: unless-stopped
    # Nicht als root: als der Benutzer des Servers, dem der Ordner ./backups gehört.
    user: "${BACKUP_UID:-1000}:${BACKUP_GID:-1000}"
    entrypoint: ["/bin/sh", "/usr/local/bin/backup.sh"]
    mem_limit: 128m
    environment:
      # Dieselbe Verbindung wie die API; backup.sh liest Host, Port, Datenbank, Benutzer und Passwort daraus.
      DUOFY_CONNECTION_STRING: ${ConnectionStrings__Duofy:?ConnectionStrings__Duofy fehlt in .env (Verbindung zur Datenbank, siehe docs/betrieb.md)}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_TIME: ${BACKUP_TIME:-03:00}
      TZ: Europe/Berlin
    volumes:
      - ./backup.sh:/usr/local/bin/backup.sh:ro
      - ./backups:/backups
    # Im Netz plagevo, weil die Sicherung nach draußen muss: zur Datenbank über Tailscale.
    networks:
      plagevo:
        ipv4_address: 172.30.10.13

volumes:
  keys:
  web-keys:

networks:
  # Das eigene Netz von Plagevo mit festem Namen, damit das Compose-Projekt des Tunnels es als externes Netz findet.
  # Feste Adressen: Gateway .1, Tunnel .2, api .11, web .12, backup .13.
  plagevo:
    name: ${PLAGEVO_NETWORK:-plagevo}
    ipam:
      config:
        - subnet: 172.30.10.0/24
          gateway: 172.30.10.1
