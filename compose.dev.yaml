# Local development — the database only. The app itself runs natively:
#
#     docker compose -f compose.dev.yaml up -d
#     cd backend && uv run uvicorn app.main:app --reload
#
# The name matters. Called `compose.yaml` this file would be the one
# `docker compose up` picks in a clone of the repository, and somebody expecting
# the whole application would get a lone database. `docker-compose.yml` next to it
# is the full stack for self-hosting; this one has to be asked for by name.

services:
  db:
    image: postgres:17-alpine
    container_name: duofy-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: duofy
      POSTGRES_PASSWORD: duofy
      POSTGRES_DB: duofy
    ports:
      - "5433:5432"
    volumes:
      - duofy-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duofy"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  duofy-pgdata:
