name: Development

# Jeder Merge auf `develop` erzeugt frische Images mit dem Tag `dev`.
on:
  push:
    branches: [develop]

concurrency:
  group: dev-images
  cancel-in-progress: true

jobs:
  # Erst prüfen, dann veröffentlichen. Ohne diese Abhängigkeit stünde nach einem
  # kaputten Merge ein kaputtes `:dev` auf Docker Hub, und wer es zieht, sucht
  # den Fehler bei sich.
  pruefen:
    uses: ./.github/workflows/ci.yml

  images:
    needs: pruefen
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - name: backend
            context: backend
          - name: frontend
            context: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/duofy-${{ matrix.name }}:dev
          # Schichten zwischen den Läufen behalten. Ohne das baut jeder Push
          # `uv sync` und `npm ci` von vorn.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
