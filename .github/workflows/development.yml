name: Development

# Jeder Merge auf `develop` erzeugt frische Images mit dem Tag `dev`.
on:
  push:
    branches: [develop]

concurrency:
  group: dev-images
  cancel-in-progress: true

jobs:
  # Erst prüfen, dann veröffentlichen. Ohne diese Abhängigkeit stünde nach einem
  # kaputten Merge ein kaputtes `:dev` auf Docker Hub, und wer es zieht, sucht
  # den Fehler bei sich.
  pruefen:
    uses: ./.github/workflows/ci.yml

  images:
    needs: pruefen
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - name: backend
            context: backend
            short: >-
              Duofy API — household finance planning for couples, families and
              shared flats
          - name: frontend
            context: frontend
            short: >-
              Duofy web interface — household finance planning for couples,
              families and shared flats

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/duofy-${{ matrix.name }}:dev
          # Schichten zwischen den Läufen behalten. Ohne das baut jeder Push
          # `uv sync` und `npm ci` von vorn.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # Hält die Beschreibung auf Docker Hub mit dem Repo synchron. Ohne das
      # pflegt man denselben Text an zwei Stellen, und eine davon veraltet.
      - uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/duofy-${{ matrix.name }}
          short-description: ${{ matrix.short }}
          readme-filepath: docker/README.${{ matrix.name }}.md
