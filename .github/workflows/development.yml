name: Development

# Every push to `main` produces fresh images tagged `dev`. Releases (`latest` and the
# version tag) are built by release.yml.
on:
  push:
    branches: [main]

# Pushes queue instead of cancelling each other: cancelling would also stop the check
# of the older push, and every state on `main` should stay checked.
concurrency:
  group: dev-images
  cancel-in-progress: false

jobs:
  # Check first, publish second. Without this dependency a broken merge would put a
  # broken `:dev` on Docker Hub, and whoever pulls it looks for the fault in their own
  # setup.
  pruefen:
    uses: ./.github/workflows/ci.yml

  images:
    needs: pruefen
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - name: backend
            context: backend
            short: >-
              Duofy API — household finance planning for couples, families and
              shared flats
          - name: frontend
            context: frontend
            short: >-
              Duofy web interface — household finance planning for couples,
              families and shared flats

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/duofy-${{ matrix.name }}:dev
          # Keep the layers between runs. Without this, every push rebuilds
          # `uv sync` and `npm ci` from scratch.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # Keeps the Docker Hub description in step with the repository. Otherwise the
      # same text is maintained in two places and one of them goes stale.
      - uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/duofy-${{ matrix.name }}
          short-description: ${{ matrix.short }}
          readme-filepath: docker/README.${{ matrix.name }}.md
