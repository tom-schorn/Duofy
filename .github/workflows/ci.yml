name: CI

# Every pull request, plus `main`. A squash merge creates a state nobody has ever
# built before, so it is checked again there.
on:
  pull_request:
  push:
    branches: [main]
  # `development.yml` calls this workflow before it builds images, which is why
  # `develop` is no longer in the push trigger above — everything would run twice.
  workflow_call:

# A new push to the same branch cancels the run in progress. Not on `main`, where
# every state should stay checked.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # The tests need a real Postgres: the models use a partial unique index and CHECK
    # constraints, and on SQLite those would go unchecked while the suite stayed
    # green.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: duofy_test
          POSTGRES_USER: duofy
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        # Without the health check the job races the database and the first test
        # fails on a connection error.
        options: >-
          --health-cmd "pg_isready -U duofy -d duofy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      # The name has to contain "test": tests/conftest.py refuses to run otherwise,
      # because its fixtures drop every table.
      POSTGRES_DB: duofy_test
      POSTGRES_USER: duofy
      POSTGRES_PASSWORD: test
      # Long enough that PyJWT does not warn about the key length on every signature.
      JWT_SECRET: dummy-value-for-ci-only-not-a-real-secret

    steps:
      - uses: actions/checkout@v7

      # Pinned in full: setup-uv publishes no moving `v9` tag, only `v9.0.0`. With
      # `@v9` GitHub cannot find the action.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # --locked fails when uv.lock does not match pyproject.toml. This is the right
      # place for that check: whoever adds a dependency and forgets `uv lock` sees it
      # on the pull request rather than later in the image build.
      - run: uv sync --locked

      - run: uv run ruff check app/ tests/

      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Types first: if they fail, the other two say nothing useful.
      - run: npx tsc --noEmit -p tsconfig.app.json

      - run: npm run lint

      - run: npm run build
