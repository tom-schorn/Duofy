name: CI

# Läuft auf jedem Pull Request und auf beiden Langzeit-Branches. Auf `develop`
# und `main` zusätzlich, weil ein Squash-Merge einen Stand erzeugt, den so noch
# nie jemand gebaut hat.
on:
  pull_request:
  push:
    branches: [main]
  # `development.yml` ruft diesen Workflow auf, bevor es Images baut. Deshalb
  # steht `develop` oben nicht mehr im Push-Auslöser — sonst liefe alles doppelt.
  workflow_call:

# Ein neuer Push auf denselben Branch bricht den laufenden Durchgang ab. Auf
# `main` nicht — dort soll jeder Stand geprüft bleiben.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # The tests need a real Postgres: the models use a partial unique index and CHECK
    # constraints, and on SQLite those would go unchecked while the suite stayed
    # green.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: duofy_test
          POSTGRES_USER: duofy
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        # Without the health check the job races the database and the first test
        # fails on a connection error.
        options: >-
          --health-cmd "pg_isready -U duofy -d duofy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      # The name has to contain "test": tests/conftest.py refuses to run otherwise,
      # because its fixtures drop every table.
      POSTGRES_DB: duofy_test
      POSTGRES_USER: duofy
      POSTGRES_PASSWORD: test
      # Long enough that PyJWT does not warn about the key length on every signature.
      JWT_SECRET: dummy-value-for-ci-only-not-a-real-secret

    steps:
      - uses: actions/checkout@v7

      # Voll gepinnt: setup-uv veröffentlicht keinen mitlaufenden Tag `v9`,
      # nur `v9.0.0`. Mit `@v9` findet GitHub die Action nicht.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # --locked: bricht ab, wenn uv.lock nicht zum pyproject.toml passt. Hier
      # ist der richtige Ort dafür — wer eine Abhängigkeit hinzufügt und
      # `uv lock` vergisst, sieht es am Pull Request statt später im Image.
      - run: uv sync --locked

      - run: uv run ruff check app/ tests/

      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Typen zuerst: schlägt das fehl, sagen die anderen beiden nichts mehr aus.
      - run: npx tsc --noEmit -p tsconfig.app.json

      - run: npm run lint

      - run: npm run build
