name: Pull Request

# `edited` matters: title and body can be changed after opening, and both are
# checked here. Without it a green tick would stay in place while saying nothing
# about the current state.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  # On squash the title becomes the commit message on `develop`, and release-please
  # derives version and changelog from it. A sloppy title therefore produces a wrong
  # version, not merely an ugly line.
  titel:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            test
            chore
          # No scope required: with two parts, backend and frontend, a scope says
          # less than the title itself.
          requireScope: false
          # A lowercase first letter is convention, but not worth failing over.
          subjectPattern: ^.{6,}$
          subjectPatternError: |
            The part after the colon is too short. "fix: bug" says nothing — write
            down what changes.

  # Proof of origin: every commit carries a Signed-off-by line, which `git commit -s`
  # adds. Deliberately here rather than through a GitHub App, so the check is visible
  # in the repository instead of hidden in a setting.
  dco:
    runs-on: ubuntu-latest
    # Two exceptions:
    #  - release-please opens its own pull requests and signs nothing
    #  - the routes between `develop` and `main`, in both directions, carry only
    #    commits already checked on the way into `develop`, or the version files
    #    release-please wrote itself
    if: >-
      github.actor != 'github-actions[bot]'
      && github.event.pull_request.base.ref != 'main'
      && github.event.pull_request.head.ref != 'main'
    steps:
      - uses: actions/checkout@v7
        with:
          # The full history, otherwise the commits of the branch are missing.
          fetch-depth: 0

      - name: Check Signed-off-by
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          while read -r sha; do
            [ -z "$sha" ] && continue
            if ! git log -1 --format='%B' "$sha" | grep -qi '^Signed-off-by: .* <.*@.*>'; then
              echo "::error::Without Signed-off-by: $(git log -1 --format='%h %s' "$sha")"
              missing=1
            fi
          done <<< "$(git rev-list "$BASE".."$HEAD")"

          if [ "$missing" -eq 1 ]; then
            echo ""
            echo "Add them afterwards:  git rebase --signoff $BASE"
            echo "From now on:          git commit -s"
            exit 1
          fi
          echo "Every commit is signed."
