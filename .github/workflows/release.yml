name: Release

# Nur `main`. Ein Merge hierher ist die Aussage „das soll raus".
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      erzeugt: ${{ steps.rp.outputs.release_created }}
      version: ${{ steps.rp.outputs.version }}

    steps:
      # Zwei Durchgänge, nicht einer:
      #
      # 1. Merge auf `main` → release-please liest die Commit-Nachrichten seit dem
      #    letzten Release, rechnet die nächste Version aus und öffnet einen
      #    Pull Request „chore(main): release 1.3.0". Darin: CHANGELOG.md,
      #    version.txt, pyproject.toml, package.json.
      # 2. Du mergest diesen Pull Request → dieser Lauf erzeugt Tag und
      #    GitHub-Release. Erst dann ist `release_created` wahr.
      #
      # Der Release entsteht also durch dein Zutun, nicht durch einen Merge nach
      # `main` allein.
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Wichtig und nicht offensichtlich: Tags und Releases, die mit dem
  # GITHUB_TOKEN erzeugt werden, lösen **keine** weiteren Workflows aus. Ein
  # eigener Workflow `on: push: tags` würde nie starten. Deshalb hängt der Bau
  # der Images hier dran, im selben Lauf.
  images:
    needs: release
    if: needs.release.outputs.erzeugt == 'true'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - name: backend
            context: backend
          - name: frontend
            context: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Zwei Tags: die Version zum Festnageln, `latest` für alle, die einfach
      # das Neueste wollen. Wer selbst hostet, sollte die Version nehmen — dann
      # ändert sich nichts unter ihm, solange er nicht selbst zieht.
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/duofy-${{ matrix.name }}:${{ needs.release.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/duofy-${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
