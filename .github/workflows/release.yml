name: Release

# `main` only. A merge here is the statement "this should go out".
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      erzeugt: ${{ steps.rp.outputs.release_created }}
      version: ${{ steps.rp.outputs.version }}

    steps:
      # Two runs, not one:
      #
      # 1. A merge into `main` — release-please reads the commit messages since the
      #    last release, works out the next version and opens a pull request called
      #    "chore(main): release 1.3.0", carrying CHANGELOG.md and version.txt.
      # 2. Merging *that* pull request — this run then creates the tag and the GitHub
      #    release. Only then is `release_created` true.
      #
      # A release therefore takes a deliberate act, not merely a merge into `main`.
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Important and not obvious: tags and releases created with the GITHUB_TOKEN
  # trigger **no** further workflows. A separate `on: push: tags` workflow would never
  # start. That is why the image build hangs off this run instead.
  images:
    needs: release
    if: needs.release.outputs.erzeugt == 'true'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - name: backend
            context: backend
          - name: frontend
            context: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Two tags: the version for pinning, `latest` for anyone who just wants the
      # newest. Self-hosters should pin — then nothing changes underneath them until
      # they pull.
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/duofy-${{ matrix.name }}:${{ needs.release.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/duofy-${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
