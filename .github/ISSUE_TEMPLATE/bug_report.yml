name: Fehlerbericht
description: Etwas funktioniert nicht so, wie es sollte
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Bitte lass deine echten Zahlen weg.** Keine Beträge, keine Kontonummern,
        keine Namen, keine Screenshots vom eigenen Plan. Duofy ist eine Finanz-App,
        und was in einem Issue landet, ist öffentlich und bleibt öffentlich.
        Ausgedachte Zahlen beschreiben einen Fehler genauso gut — `1234.56` bricht
        genau so wie deine Miete.

  - type: textarea
    id: what-happened
    attributes:
      label: Was ist passiert
      description: Was du getan hast, was du erwartet hast, was stattdessen herauskam.
      placeholder: |
        Ich habe im Haushaltsplan einen Posten abgehakt.
        Ich habe erwartet, dass der Betrag aus „Noch offen" verschwindet.
        Stattdessen blieb die Zahl gleich und änderte sich erst nach dem Neuladen.
    validations:
      required: true

  - type: dropdown
    id: how-run
    attributes:
      label: Wie betreibst du Duofy
      options:
        - Docker Compose, selbst gehostet
        - Aus dem Quellcode, zur Entwicklung
        - Anders — oben beschrieben
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: >-
        Der Image-Tag, den du gezogen hast, oder der Inhalt von `version.txt`.
        `dev` und `latest` sind auch Antworten — sie bewegen sich nur, bitte das
        Datum dazuschreiben.
      placeholder: "0.2.0, oder dev vom 2026-08-14"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Log-Ausgabe
      description: >-
        `docker compose logs backend` für alles, was auf dem Server schiefgeht,
        die Browser-Konsole für alles auf dem Bildschirm. Optional — macht aber
        meistens aus einer Vermutung eine Antwort.
      render: text

  - type: checkboxes
    id: no-real-data
    attributes:
      label: Vor dem Absenden
      options:
        - label: >-
            In diesem Bericht stehen keine echten Beträge, Namen oder Kontonummern.
          required: true
        - label: >-
            Ich habe die offenen Issues durchsucht, und das hier ist keins davon.
          required: true
